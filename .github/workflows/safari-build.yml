name: Build Safari Extension (macOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'project-dna-extension/**'

jobs:
  build-safari-app:
    runs-on: macos-14
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Convert Chrome Extension to Safari App
        run: |
          xcrun safari-web-extension-converter project-dna-extension \
            --project-location safari-build \
            --app-name "ProjectDNA" \
            --bundle-identifier "com.igorvl.projectdna" \
            --no-prompt --no-open
            
      - name: 🛠️ Patch Minimum OS Version
        run: |
          cd safari-build
          echo "Patching minimum OS versions in plists..."
          find . -name "Info.plist" -exec plutil -replace LSMinimumSystemVersion -string "12.0" {} \; || true
          find . -name "project.pbxproj" -exec sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [^;]*;/MACOSX_DEPLOYMENT_TARGET = 12.0;/g' {} \; || true
            
      - name: 🏗️ Build Xcode Project (Unsigned)
        id: build
        run: |
          cd safari-build
          echo "🔍 Finding project file..."
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ No .xcodeproj found!"
            exit 1
          fi
          echo "Found project file: $PROJECT_FILE"
          
          echo "🔍 Available schemes:"
          xcodebuild -list -project "$PROJECT_FILE" || true
          
          echo "🛠️ Building (macOS) Scheme..."
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "ProjectDNA (macOS)" \
                     -configuration Release \
                     SYMROOT="$PWD/build" \
                     ARCHS="x86_64 arm64" \
                     MACOSX_DEPLOYMENT_TARGET="12.0" \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build || \
          xcodebuild -project "$PROJECT_FILE" \
                     -scheme "ProjectDNA" \
                     -configuration Release \
                     SYMROOT="$PWD/build" \
                     ARCHS="x86_64 arm64" \
                     MACOSX_DEPLOYMENT_TARGET="12.0" \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: 📦 Zip macOS App
        run: |
          cd safari-build/build/Release
          zip -r ProjectDNA-Safari-App.zip *.app
          
      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Safari-Extension-macOS
          path: safari-build/build/Release/ProjectDNA-Safari-App.zip
          retention-days: 7

      - name: 🚑 Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-safari-build
          path: safari-build/
          retention-days: 1
