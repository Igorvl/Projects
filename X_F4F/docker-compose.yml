version: '3.8'

services:
  x-growth-engine:
    build: .
    container_name: x-growth-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_TYPE=postgres
    ports:
      - "8085:8085"
    volumes:
      - ./data:/app/data
      - ./profiles:/app/profiles
    networks:
      - default

networks:
  default:
    name: internal_network
    external: true
