    });

  }, [selectedItems, excludedItems, itemWeights, mjParams, psdnParams, matrixMode, behanceMode, rawReality, filmProfile, luxuryLevel, targetFormat, narrativeScenario, posterScenario, customSubject, projectTitle, customText, briefLogo, resultImage, decayLevel, composition, refs, isReady]);

/* Mount — with DB server fetch */
(function(){
  var rootEl = document.getElementById('root');
  (async function() {
    try {
      var resp = await fetch('/strips-db/categories');
      if (resp.ok) {
        var serverCats = await resp.json();
        // Override the hardcoded CATEGORIES with the server version
        Object.keys(serverCats).forEach(function(k) {
          CATEGORIES[k] = serverCats[k];
        });
        console.log('[STRIPS] Categories loaded from server DB');
      }
    } catch(e) {
      console.warn('[STRIPS] Server DB unavailable, using hardcoded fallback:', e.message);
    }
    ReactDOM.createRoot(rootEl).render(React.createElement(App, null));
  })();
})();
  </script>
