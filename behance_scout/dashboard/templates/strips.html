      { id: 4, short: 'Softbox / Shadowless', val: 'massive sterile diffused softboxes for a completely shadowless, clinical look' },
      { id: 5, short: 'Edge-Lit / Cinematic', val: 'cinematic edge-lit rim lighting separating the strips from the void' },
      { id: 6, short: 'HMI Projector / Optical Snoot', val: 'an HMI daylight projector using an optical snoot to spotlight specific data' },
      { id: 7, short: 'Low-Key / Chiaroscuro', val: 'low-key Chiaroscuro lighting wrapping the objects in deep Renaissance shadows' },
      { id: 8, short: 'Tungsten / Warm Spot', val: 'warm, directional Tungsten studio spotlights creating long elegant shadows' },
      { id: 9, short: 'UV Blacklight', val: 'ultraviolet blacklight photography revealing hidden fluorescent layers' },
      { id: 10, short: 'Electron Microscope Scan', val: 'a Scanning Electron Microscope (SEM) aesthetic with infinite depth of field' },
      { id: 11, short: 'Thermal Imaging Lens', val: 'a FLIR thermal imaging aesthetic with chromatic heat signatures' },
      { id: 12, short: '50mm Prime / Golden Hour', val: 'a 50mm prime lens bathed in warm, harsh Golden Hour sunlight' },
      { id: 13, short: 'Slit-Lamp / Clinical', val: 'an ophthalmic slit-lamp bio-microscope lighting setup for surgical precision' },
      { id: 14, short: 'Fiber Optic / Pinpoint', val: 'micro-fiber optic pinpoint lighting highlighting extreme typographic details' },
      { id: 15, short: 'Flash Photography / Paparazzi', val: 'direct, blown-out on-camera flash photography mimicking raw paparazzi shots' },
      { id: 16, short: 'Slanted Light / Texture', val: 'extreme raking/slanted light to maximize the physical texture of the paper' },
      { id: 17, short: 'Sub-aquatic Caustics', val: 'lighting projected through rippling water to create sub-aquatic caustics' },
      { id: 18, short: 'Neon Tube / Cyberpunk', val: 'practical neon tube lighting casting harsh, artificial color gradients' },
      { id: 19, short: 'Diffused Tent / E-Commerce', val: 'a perfect white diffused light tent for absolute product clarity' },
      { id: 20, short: 'X-Ray Backlight', val: 'a sterile lightbox backlighting the strips like a medical X-ray film' }
    ]
  },
  10: {
    title: '10. ТРИГГЕР-ФОКУС',
    items: [
      { id: 1, short: 'Геометрический Блок', val: 'a colossal solid geometric block' },
      { id: 2, short: 'Векторный Срез', val: 'a harsh vector slice violently splitting the layout' },
      { id: 3, short: 'Штрих Маркера', val: 'a disruptive, hyper-vibrant graphic marker slash redacting data' },
      { id: 4, short: 'Идеальный Круг', val: 'a flawless, void-like black circle cutting through the grid' },
      { id: 5, short: 'Диодный Пиксель', val: 'a single graphic row of glowing LED-style pixels' },
      { id: 6, short: 'Плоский Эмбосс', val: 'a flat-vector simulated blind emboss effect' },
      { id: 7, short: 'Графический Надор', val: 'a sharp graphic illustration of a paper tear revealing contrasting color' },
      { id: 8, short: 'Хромированный Вектор', val: 'a hyper-reflective metallic ink overlay rendered graphically' },
      { id: 9, short: 'Векторный Хазард', val: 'a sharp geometric chevron hazard banner' },
      { id: 10, short: 'Иллюстрация Ожога', val: 'a scorched graphic laser burn mark cutting through text' },
      { id: 11, short: 'Круглая Печать', val: 'a strict circular vector certification stamp' },
      { id: 12, short: 'Блэкаут-Полоса', val: 'a heavy, solid blackout redaction bar' },
      { id: 13, short: 'Фосфорная Графика', val: 'a graphic simulation of a phosphorescent glow-in-the-dark section' },
      { id: 14, short: 'Хроматический Глитч', val: 'a simulated heat-reactive chromatic glitch smudge' },
      { id: 15, short: 'Взрывной Халфтон', val: 'an extreme, blown-out halftone dot pattern overlay' },
      { id: 16, short: 'Бесконечный Штрихкод', val: 'a dense barcode stretched vertically to infinity' },
      { id: 17, short: 'Массивный Иероглиф', val: 'a massive unreadable Kanji/Cyrillic vector letterform' },
      { id: 18, short: 'Муар Блок', val: 'an optical illusion moire pattern block' },
      { id: 19, short: 'Концентрическая Мишень', val: 'a perfectly drafted concentric sniper reticle' },
      { id: 20, short: 'Фрагмент Гравюры', val: 'a sharply cropped fragment of a classical engraving mixed with data' },
      { id: 21, short: 'Красная Печать', val: 'a stark, physical red wax seal' },
      { id: 22, short: 'Канцелярская Скрепка', val: 'a hyper-realistic metallic paperclip holding a note' },
      { id: 23, short: 'Отпечаток Пальца', val: 'a realistic, dusty thumbprint smudging the text' },
      { id: 24, short: 'След от Чашки Кофе', val: 'a faint, overlapping coffee ring stain' },
      { id: 25, short: 'Технический Скотч', val: 'a piece of rough masking tape covering data' },
      { id: 26, short: 'Прокол Дырокола', val: 'a perfectly round hole punch showing the background void' },
      { id: 27, short: 'Капля Чернил', val: "a single, thick droplet of wet black printer's ink" },
      { id: 28, short: 'Мерная Линейка', val: 'a physical translucent plastic ruler laid over the layout' },
      { id: 29, short: 'Штамп ОТК', val: "a faded, misaligned 'PASSED QUALITY CONTROL' rubber stamp" },
      { id: 30, short: 'Царапина на Металле', val: 'a deep, realistic scratch simulating damaged metal' }
    ]
  }
};

const App = () => {
  const [selectedItems, setSelectedItems] = useState({});
  const [itemWeights, setItemWeights] = useState({});
  const [mjParams, setMjParams] = useState({ ar: '9:16', stylize: 250, chaos: 0, weird: 0, sref: '' });
  const [psdnMode, setPsdnMode] = useState(false);
  const [parserInput, setParserInput] = useState('');
  const [copied, setCopied] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiError, setAiError] = useState('');
  const [isReady, setIsReady] = useState(false);

  useEffect(() => {
    const hash = window.location.hash.slice(1);
    if (hash) {
      try {
        const state = JSON.parse(decodeURIComponent(hash));
        if (state.s) setSelectedItems(state.s);
        if (state.w) setItemWeights(state.w);
        if (state.p) setMjParams(prev => ({ ...prev, ...state.p }));
        if (state.ps !== undefined) setPsdnMode(state.ps);
      } catch (e) {
        console.error("URL Parsing error", e);
      }
    } else {
      const defaultState = {};
      Object.keys(CATEGORIES).forEach(key => defaultState[key] = []);
      setSelectedItems(defaultState);
    }
    setIsReady(true);
  }, []);

  useEffect(() => {
    if (!isReady) return;
    const state = { s: selectedItems, w: itemWeights, p: mjParams, ps: psdnMode };
    window.history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(state)));
    const parserStr = Object.entries(selectedItems)
      .filter(([_, arr]) => arr && arr.length > 0)
      .map(([cId, arr]) => `${cId}(${arr.join(', ')})`)
      .join(' - ');
    setParserInput(parserStr);
  }, [selectedItems, itemWeights, mjParams, psdnMode, isReady]);

  const handleToggle = (categoryId, itemId) => {
    setSelectedItems(prev => {
      const catSelections = prev[categoryId] || [];
      if (catSelections.includes(itemId)) {
        const newWeights = { ...itemWeights };
        delete newWeights[`${categoryId}-${itemId}`];
        setItemWeights(newWeights);
        return { ...prev, [categoryId]: catSelections.filter(id => id !== itemId) };
      } else {
        return { ...prev, [categoryId]: [...catSelections, itemId] };
      }
    });
  };

  const handleDoubleClick = (categoryId, itemId) => {
    const key = `${categoryId}-${itemId}`;
    setItemWeights(prev => ({
      ...prev,
      [key]: prev[key] === 2 ? 1 : 2
    }));
  };

  const handleParse = (e) => {
    const val = e.target.value;
    setParserInput(val);
    if (!val) { setSelectedItems({}); setItemWeights({}); return; }
    const newSelections = {};
    Object.keys(CATEGORIES).forEach(key => newSelections[key] = []);
    const parts = val.split('-');
    parts.forEach(part => {
      const match = part.match(/(\d+)\(([\d,\s]+)\)/);
      if (match) {
        const catId = match[1];
        const itemIds = match[2].split(',').map(s => parseInt(s.trim()));
        if (CATEGORIES[catId]) newSelections[catId] = itemIds.filter(id => !isNaN(id));
      }
    });
    setSelectedItems(newSelections);
  };

  // ========================================
  // AI GENERATION — routes through our LLM router
  // ========================================
  const generateAIConcept = async () => {
    if (!aiPrompt.trim()) return;
    setIsGenerating(true);
    setAiError('');

    const catalogSummary = Object.entries(CATEGORIES).map(([cId, cat]) =>
      `C${cId}[${cat.title}]: ${cat.items.map(i => `${i.id}=${i.short}`).join(' | ')}`
    ).join('\n');

    try {
      const resp = await fetch('/api/strips/ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concept: aiPrompt.trim(), catalog_summary: catalogSummary })
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        throw new Error(errData.error || `HTTP ${resp.status}`);
      }

      const newSelections = await resp.json();
      if (newSelections.error) throw new Error(newSelections.error);

      const validSelections = {};
      Object.keys(CATEGORIES).forEach(key => validSelections[key] = []);
      Object.keys(newSelections).forEach(cId => {
        if (validSelections[cId] !== undefined && Array.isArray(newSelections[cId])) {
          validSelections[cId] = newSelections[cId].filter(id =>
            CATEGORIES[cId]?.items.some(item => item.id === id)
          );
        }
      });

      setSelectedItems(validSelections);
      setItemWeights({});
    } catch (err) {
      console.error(err);
      setAiError(`Ошибка: ${err.message}`);
    } finally {
      setIsGenerating(false);
    }
  };

  const generatePrompt = () => {
    const getVal = (cId) => {
      const selections = selectedItems[cId];
      if (!selections || selections.length === 0) return `[[C${cId}]]`;
      return selections
        .map(id => {
          const item = CATEGORIES[cId].items.find(i => i.id === id);
          if (!item) return '';
          const weight = itemWeights[`${cId}-${id}`];
          return weight > 1 ? `${item.val}::${weight}` : item.val;
        })
        .filter(Boolean)
        .join(' and ');
    };

    const psdnOptics = psdnMode ? " Enhanced with hyper-realistic P.S.D.N. optical physics, extreme subsurface scattering, caustic reflections, and structural tension." : "";
    const mjEngine = `--ar ${mjParams.ar} --style raw --v 6.1 --s ${mjParams.stylize} ${mjParams.chaos > 0 ? `--c ${mjParams.chaos} ` : ''}${mjParams.weird > 0 ? `--w ${mjParams.weird} ` : ''}${mjParams.sref ? `--sref ${mjParams.sref} ` : ''}--no sliced image, crossed elements, overwhelming clutter`;

    return `Act as a world-renowned art director. You are creating a museum-quality exhibition collection of four distinct pieces. Your task is to generate a photorealistic flat-lay photograph of four tall, vertical, skinny bookmark-style design strips arranged side-by-side with physical gaps between them.

CRITICAL ANTI-SLICING & HIERARCHY RULE: The image MUST NOT look like a single poster cut into pieces. No graphic element can cross the gaps. Apply a sophisticated balance of negative space and high-density data clusters. Leave deliberate "air" to let the design breathe, but ensure the micro-text and vectors are grouped into highly detailed technical blocks.

[Paradigm & Conceptual DNA] The aesthetic follows the ${getVal(1)} school. The conceptual design DNA fuses the aesthetics of: ${getVal(2)}.

[Color Palette & EXACT ROTATION] The unified 3-color palette is strictly: ${getVal(3)}. Let us define them as First Base, Second Base, and Third Base (with the remaining two acting as Sec and Acc on each strip). CRITICAL COLOR ROTATION: All 4 strips must use all 3 colors, but their proportional dominance must rotate exactly as follows: ${getVal(4)}. Each strip must obey its specific mathematical color ratio.

[Structure & Graphics] The layout uses ${getVal(5)}. Introduce structured dynamic composition using: ${getVal(6)}. Super-graphics and dense micro-text must read exactly: ${getVal(7)}.

[Tactility & Optics] Printed using ${getVal(8)}. Captured using ${getVal(9)}.${psdnOptics}

[Trigger] The mechanical logic is disrupted by ${getVal(10)} on ONE strip.

[Technical Specs] Ultra-crisp, photorealistic. Maximalist brutalist typographic logic. Flawless micro-text rendering. No soft gradients. ${mjEngine}`;
  };

  const copyToClipboard = () => {
    navigator.clipboard.writeText(generatePrompt());
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const statusString = useMemo(() => {
    return Object.keys(CATEGORIES).map(cId => `C${cId}[${selectedItems[cId]?.length || 0}]`).join(' · ');
  }, [selectedItems]);

  return (
    <div className="flex flex-row h-screen w-full bg-[#050608] text-[#d4d4d4] font-sans overflow-hidden">

      {/* LEFT PANEL */}
      <div className="w-[380px] shrink-0 flex flex-col h-screen border-r border-[#23262e] bg-[#0f1115] shadow-[5px_0_20px_rgba(0,0,0,0.5)] z-20">

        {/* Header */}
        <div className="p-5 border-b border-[#23262e] shrink-0">
          <h2 className="m-0 text-xl tracking-widest uppercase font-black text-white">STRIPS PRO GEN</h2>
          <div className="flex justify-between items-center mt-1">
            <div className="text-[10px] text-[#c8aa6e] tracking-widest uppercase">V16: K.S.A.R. & P.S.D.N.</div>
            <a href="/" className="text-[10px] text-[#7a8294] hover:text-[#c8aa6e] no-underline transition-colors">← Dashboard</a>
          </div>
        </div>

        {/* Scrollable controls */}
        <div className="flex-1 overflow-y-auto flex flex-col min-h-0 custom-scrollbar">

          {/* MJ Engine */}
          <div className="p-5 border-b border-[#23262e] bg-[#12141a]">
            <div className="flex justify-between items-center mb-4">
              <span className="text-xs font-bold tracking-widest text-white uppercase">MJ Engine</span>
              <label className="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" checked={psdnMode} onChange={() => setPsdnMode(!psdnMode)} />
                <span className={psdnMode ? 'text-[#c8aa6e] font-bold text-[10px] tracking-wider' : 'text-[#7a8294] text-[10px] tracking-wider'}>P.S.D.N.</span>
              </label>
            </div>
            <div className="grid grid-cols-2 gap-4">
              <div className="flex flex-col gap-1.5">
                <label className="text-[10px] text-[#7a8294] uppercase tracking-wider">Format (--ar)</label>
                <select value={mjParams.ar} onChange={e => setMjParams({...mjParams, ar: e.target.value})} className="bg-[#050608] border border-[#23262e] text-[#d4d4d4] p-1.5 text-xs outline-none focus:border-[#c8aa6e] rounded-sm">
                  <option value="9:16">9:16 (Strips)</option>
                  <option value="1:1">1:1 (Monolith)</option>
                  <option value="16:9">16:9 (Landscape)</option>
                  <option value="21:9">21:9 (Cinematic)</option>
                </select>
              </div>
              <div className="flex flex-col gap-1.5">
                <label className="text-[10px] text-[#7a8294] uppercase tracking-wider">Style (--sref)</label>
                <input type="text" value={mjParams.sref} onChange={e => setMjParams({...mjParams, sref: e.target.value})} placeholder="URL..." className="bg-[#050608] border border-[#23262e] text-[#d4d4d4] p-1.5 text-xs outline-none focus:border-[#c8aa6e] rounded-sm" />
              </div>
              <div className="flex flex-col gap-1.5">
                <div className="flex justify-between text-[10px] uppercase tracking-wider">
                  <span className="text-[#7a8294]">Stylize</span>
                  <span className="text-[#c8aa6e] font-mono">{mjParams.stylize}</span>
                </div>
                <input type="range" min="0" max="1000" step="50" value={mjParams.stylize} onChange={e => setMjParams({...mjParams, stylize: parseInt(e.target.value)})} className="h-1 bg-[#23262e] appearance-none rounded-full cursor-pointer" />
              </div>
              <div className="flex flex-col gap-1.5">
                <div className="flex justify-between text-[10px] uppercase tracking-wider">
                  <span className="text-[#7a8294]">Chaos</span>
                  <span className="text-[#c8aa6e] font-mono">{mjParams.chaos}</span>
                </div>
                <input type="range" min="0" max="100" step="5" value={mjParams.chaos} onChange={e => setMjParams({...mjParams, chaos: parseInt(e.target.value)})} className="h-1 bg-[#23262e] appearance-none rounded-full cursor-pointer" />
              </div>
              <div className="flex flex-col gap-1.5 col-span-2">
                <div className="flex justify-between text-[10px] uppercase tracking-wider">
                  <span className="text-[#7a8294]">Weird</span>
                  <span className="text-[#c8aa6e] font-mono">{mjParams.weird}</span>
                </div>
                <input type="range" min="0" max="3000" step="100" value={mjParams.weird} onChange={e => setMjParams({...mjParams, weird: parseInt(e.target.value)})} className="h-1 bg-[#23262e] appearance-none rounded-full cursor-pointer" />
              </div>
            </div>
          </div>

          {/* AI Generator & Parser */}
          <div className="p-5 border-b border-[#23262e] flex flex-col gap-4">
            <div className="flex flex-col gap-1.5">
              <label className="text-[10px] text-[#7a8294] uppercase tracking-wider">Semantic AI Parser</label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={aiPrompt}
                  onChange={(e) => setAiPrompt(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && generateAIConcept()}
                  placeholder="Опишите атмосферу..."
                  className="flex-1 p-2 bg-[#050608] border border-[#c8aa6e]/30 text-[#d4d4d4] text-xs outline-none focus:border-[#c8aa6e] transition-colors placeholder-[#4b5563] rounded-sm"
                  disabled={isGenerating}
                />
                <button
                  onClick={generateAIConcept}
                  disabled={isGenerating || !aiPrompt.trim()}
                  className={`px-3 py-2 font-bold uppercase text-[10px] tracking-wider border-none rounded-sm cursor-pointer transition-colors whitespace-nowrap ${isGenerating ? 'bg-[#23262e] text-[#7a8294]' : 'bg-[#c8aa6e] text-[#050608] hover:bg-[#d6b77c]'}`}
                >
                  {isGenerating ? '...' : 'ИИ-СБОРКА'}
                </button>
              </div>
              {aiError && <div className="text-red-500 text-[10px] mt-1">{aiError}</div>}
            </div>
            <div className="flex flex-col gap-1.5">
              <label className="text-[10px] text-[#7a8294] uppercase tracking-wider flex justify-between">
                <span>Code String</span>
                <span className="text-[#c8aa6e] opacity-70 cursor-help" title="2x Click on any tag to increase weight (::2)">(2x Click = Weight)</span>
              </label>
              <input
                type="text"
                value={parserInput}
                onChange={handleParse}
                placeholder="1(1) - 4(1) - 6(2, 3)..."
                className="w-full p-2 bg-[#050608] border border-[#23262e] text-[#c8aa6e] font-mono text-xs outline-none focus:border-[#c8aa6e] transition-colors rounded-sm"
              />
            </div>
          </div>

          {/* Prompt Output */}
          <div className="flex-1 flex flex-col p-5 bg-[#050608] min-h-[180px]">
            <div className="text-[10px] text-[#7a8294] font-mono mb-2 flex justify-between flex-wrap gap-1">
              <span>STATUS:</span>
              <span className="text-[#c8aa6e] text-right">{statusString}</span>
            </div>
            <textarea
              readOnly
              value={generatePrompt()}
              className="flex-1 w-full bg-[#0f1115] text-[#d4d4d4] border border-[#23262e] p-3 font-mono text-[11px] leading-relaxed resize-none outline-none focus:border-[#c8aa6e]/50 transition-colors rounded-sm custom-scrollbar"
            />
          </div>
        </div>

        {/* Copy Button */}
        <button
          onClick={copyToClipboard}
          className={`shrink-0 w-full h-[56px] font-black uppercase text-sm tracking-[0.2em] transition-colors duration-200 border-none cursor-pointer ${copied ? 'bg-white text-black' : 'bg-[#c8aa6e] text-[#050608] hover:bg-[#d6b77c]'}`}
        >
          {copied ? '✓ COPIED TO CLIPBOARD' : 'COPY PROMPT'}
        </button>
      </div>

      {/* RIGHT PANEL — Categories */}
      <div className="flex-1 h-screen overflow-y-auto bg-[#050608] p-8 flex flex-col gap-8 pb-32 custom-scrollbar">
        {Object.entries(CATEGORIES).map(([cId, category]) => (
          <div key={cId}>
            <div className="flex items-center gap-4 mb-4">
              <h3 className="m-0 text-sm text-[#c8aa6e] tracking-[0.15em] uppercase font-bold shrink-0">{category.title}</h3>
              <div className="flex-1 h-px bg-[#23262e]"></div>
            </div>
            <div className="grid grid-cols-[repeat(auto-fill,minmax(155px,1fr))] gap-2">
              {category.items.map(item => {
                const isSelected = selectedItems[cId]?.includes(item.id);
                const weight = itemWeights[`${cId}-${item.id}`] || 1;
                return (
                  <button
                    key={item.id}
                    onClick={() => handleToggle(cId, item.id)}
                    onDoubleClick={(e) => { e.preventDefault(); handleDoubleClick(cId, item.id); }}
                    title={item.val}
                    className={`px-2.5 py-2 text-[11px] font-mono border text-left min-h-[36px] transition-all duration-150 cursor-pointer rounded-sm flex justify-between items-center
                      ${isSelected
                        ? 'bg-[#c8aa6e] border-[#c8aa6e] text-[#050608] font-bold'
                        : 'bg-[#0f1115] border-[#23262e] text-[#7a8294] hover:border-[#c8aa6e]/40 hover:bg-[#13151a]'
                      }`}
                  >
                    <span className="truncate pr-2">{item.id}. {item.short}</span>
                    {isSelected && weight > 1 && (
                      <span className="px-1.5 py-0.5 bg-[#050608] text-[#c8aa6e] rounded-sm text-[9px] font-black border border-black/20 shrink-0">::2</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <style dangerouslySetInnerHTML={{__html: `
        input[type=range]::-webkit-slider-thumb { background: #c8aa6e; }
        input[type=range]::-moz-range-thumb { background: #c8aa6e; border: none; }
      `}} />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
