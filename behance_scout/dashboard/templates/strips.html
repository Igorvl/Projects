};

// APP COMPONENT
// ═══════════════════════════════════════════════════════════════════
const App = () => {
  const [selectedItems, setSelectedItems] = useState({});
  const [excludedItems, setExcludedItems] = useState({});
  const [itemWeights, setItemWeights] = useState({});
  const [mjParams, setMjParams] = useState({ar:'9:16',stylize:250,chaos:0,weird:0,sref:''});
  const [psdnParams, setPsdnParams] = useState({subsurface:0,tension:0,clinical:0});
  const [filmProfile, setFilmProfile] = useState('none');
  const [composition, setComposition] = useState('none');
  const [matrixMode, setMatrixMode] = useState(false);
  const [behanceMode, setBehanceMode] = useState(false);
  const [rawReality, setRawReality] = useState(true);
  const [luxuryLevel, setLuxuryLevel] = useState(0);
  const [decayLevel, setDecayLevel] = useState(0);
  const [targetFormat, setTargetFormat] = useState('strips');
  const [customSubject, setCustomSubject] = useState('');
  const [projectTitle, setProjectTitle] = useState('');
  const [customText, setCustomText] = useState('');
  const [refs, setRefs] = useState({img:'',cref:'',p:''});
  const [parserInput, setParserInput] = useState('');
  const [copied, setCopied] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [aiPrompt, setAiPrompt] = useState('');
  const [aiError, setAiError] = useState('');
  const [isReady, setIsReady] = useState(false);
  const [customProtocols, setCustomProtocols] = useState({});
  const [showBrief, setShowBrief] = useState(false);

  // ── Init from URL hash
  useEffect(() => {
    const hash = window.location.hash.slice(1);
    if (hash) {
      try {
        const s = JSON.parse(decodeURIComponent(hash));
        if (s.s) setSelectedItems(s.s);
        if (s.e) setExcludedItems(s.e);
        if (s.w) setItemWeights(s.w);
        if (s.p) setMjParams(prev => ({...prev,...s.p}));
        if (s.ps !== undefined) {
          if (typeof s.ps === 'boolean') setPsdnParams({subsurface:s.ps?80:0,tension:0,clinical:0});
          else setPsdnParams(s.ps);
        }
        if (s.mx !== undefined) setMatrixMode(s.mx);
        if (s.rr !== undefined) setRawReality(s.rr);
        if (s.fp !== undefined) setFilmProfile(s.fp);
        if (s.lx !== undefined) setLuxuryLevel(s.lx);
        if (s.tf !== undefined) setTargetFormat(s.tf);
        if (s.cs !== undefined) setCustomSubject(s.cs);
        if (s.dy !== undefined) setDecayLevel(s.dy);
        if (s.cmp !== undefined) setComposition(s.cmp);
        if (s.rf) setRefs(s.rf);
        if (s.bh !== undefined) setBehanceMode(s.bh);
        if (s.pt !== undefined) setProjectTitle(s.pt);
        if (s.ct !== undefined) setCustomText(s.ct);
      } catch(e) { console.error('URL parse error', e); }
    } else {
      const def = {};
      Object.keys(CATEGORIES).forEach(k => { def[k] = []; });
      setSelectedItems(def);
      setExcludedItems(def);
    }
    setIsReady(true);
    const saved = localStorage.getItem('ksar_custom_protocols');
    if (saved) { try { setCustomProtocols(JSON.parse(saved)); } catch(e) {} }
  }, []);

  // ── Sync to URL hash + update parser string
  useEffect(() => {
    if (!isReady) return;
    const state = {s:selectedItems,e:excludedItems,w:itemWeights,p:mjParams,ps:psdnParams,mx:matrixMode,bh:behanceMode,rr:rawReality,fp:filmProfile,lx:luxuryLevel,tf:targetFormat,cs:customSubject,pt:projectTitle,ct:customText,dy:decayLevel,cmp:composition,rf:refs};
    window.history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify(state)));

    const parts = [];
    Object.keys(CATEGORIES).sort((a,b)=>Number(a)-Number(b)).forEach(cId => {
      const sel = selectedItems[cId] || [];
      const exc = excludedItems[cId] || [];
      const selStrs = sel.map(id => {
        const w = itemWeights[`${cId}-${id}`];
        return w && w > 1 ? `${id}::${w}` : `${id}`;
      });
      if (selStrs.length > 0) parts.push(`${cId}(${selStrs.join(', ')})`);
      if (exc.length > 0) parts.push(`!${cId}(${exc.join(', ')})`);
    });
    setParserInput(parts.join(' - '));
  }, [selectedItems,excludedItems,itemWeights,mjParams,psdnParams,matrixMode,behanceMode,rawReality,filmProfile,luxuryLevel,targetFormat,customSubject,projectTitle,customText,decayLevel,composition,refs,isReady]);

  // ── Handlers
  const handleToggle = (cId, itemId) => {
    if (excludedItems[cId]?.includes(itemId)) {
      setExcludedItems(p => ({...p,[cId]:p[cId].filter(id=>id!==itemId)}));
      return;
    }
    setSelectedItems(p => {
      const cur = p[cId] || [];
      if (cur.includes(itemId)) {
        const nw = {...itemWeights}; delete nw[`${cId}-${itemId}`]; setItemWeights(nw);
        return {...p,[cId]:cur.filter(id=>id!==itemId)};
      }
      return {...p,[cId]:[...cur,itemId]};
    });
  };

  const handleExclude = (cId, itemId) => {
    if (selectedItems[cId]?.includes(itemId)) {
      setSelectedItems(p => ({...p,[cId]:p[cId].filter(id=>id!==itemId)}));
      const nw = {...itemWeights}; delete nw[`${cId}-${itemId}`]; setItemWeights(nw);
    }
    setExcludedItems(p => {
      const cur = p[cId] || [];
      if (cur.includes(itemId)) return {...p,[cId]:cur.filter(id=>id!==itemId)};
      return {...p,[cId]:[...cur,itemId]};
    });
  };

  const handleDoubleClick = (cId, itemId) => {
    if (excludedItems[cId]?.includes(itemId)) return;
    const key = `${cId}-${itemId}`;
    setItemWeights(p => ({...p,[key]:p[key]===2?1:2}));
  };

  const handleParse = (e) => {
    const val = e.target.value;
    setParserInput(val);
    if (!val) { setSelectedItems({}); setExcludedItems({}); setItemWeights({}); return; }
    const newSel = {}; const newExc = {}; const newW = {};
    Object.keys(CATEGORIES).forEach(k => { newSel[k]=[]; newExc[k]=[]; });
    val.split('-').forEach(part => {
      const m = part.trim().match(/^(!?)(\d+)\((.+)\)$/);
      if (m) {
        const isExc = m[1]==='!', catId = m[2];
        if (CATEGORIES[catId]) {
          m[3].split(',').forEach(s => {
            const [idStr,wStr] = s.split('::');
            const id = parseInt(idStr.trim());
            if (!isNaN(id)) {
              if (isExc) newExc[catId].push(id);
              else { newSel[catId].push(id); if(wStr) newW[`${catId}-${id}`]=parseInt(wStr.trim()); }
            }
          });
        }
      }
    });
    setSelectedItems(newSel); setExcludedItems(newExc); setItemWeights(newW);
  };

  const applyProtocol = (key, isCustom = false) => {
    const proto = isCustom ? customProtocols[key] : PROTOCOLS[key]; if(!proto) return;
    setSelectedItems(prev => {
      const m = {...prev};
      Object.keys(CATEGORIES).forEach(k => { const ex=m[k]||[]; const add=proto.s[k]||[]; m[k]=Array.from(new Set([...ex,...add])); });
      return m;
    });
    setExcludedItems(prev => {
      const m = {...prev};
      Object.keys(CATEGORIES).forEach(k => { const add=proto.s[k]||[]; m[k]=(m[k]||[]).filter(id=>!add.includes(id)); });
      return m;
    });
    setPsdnParams(proto.p||{subsurface:0,tension:0,clinical:0}); setMjParams(proto.mj||{ar:'9:16',stylize:250,chaos:0,weird:0,sref:''});
    setFilmProfile(proto.fp||'none'); setMatrixMode(proto.mx||false);
    setRawReality(proto.rr!==undefined?proto.rr:true);
    setLuxuryLevel(proto.lx||0);
    if(proto.dy!==undefined) setDecayLevel(proto.dy);
    if(proto.cmp!==undefined) setComposition(proto.cmp);
    if(proto.tf!==undefined) setTargetFormat(proto.tf);
    if(proto.bh!==undefined) setBehanceMode(proto.bh);
    if(proto.w!==undefined) setItemWeights(proto.w);
    if(proto.e!==undefined) setExcludedItems(proto.e);
  };

  const handleMatrixToggle = () => {
    setMatrixMode(v => !v);
    if (!matrixMode) setBehanceMode(false);
  };

  const handleBehanceToggle = () => {
    setBehanceMode(v => !v);
    if (!behanceMode) setMatrixMode(false);
  };

  const saveCustomProtocol = () => {
    const name = window.prompt('Название нового пресета:');
    if (!name) return;
    const newProto = {
      name: name.toUpperCase(), desc: 'Custom user protocol.',
      s: selectedItems, e: excludedItems, w: itemWeights,
      p: psdnParams, mj: mjParams, fp: filmProfile, lx: luxuryLevel,
      dy: decayLevel, cmp: composition, tf: targetFormat,
      rr: rawReality, mx: matrixMode, bh: behanceMode
    };
    const updated = {...customProtocols, [Date.now()]: newProto};
    setCustomProtocols(updated);
    localStorage.setItem('ksar_custom_protocols', JSON.stringify(updated));
  };

  const deleteCustomProtocol = (keyStr, e) => {
    e.stopPropagation();
    const updated = {...customProtocols};
    delete updated[keyStr];
    setCustomProtocols(updated);
    localStorage.setItem('ksar_custom_protocols', JSON.stringify(updated));
  };

  const handleQuantumMutation = () => {
    const rnd = (arr, n) => [...arr].sort(()=>0.5-Math.random()).slice(0,n).map(i=>i.id);
    setSelectedItems({
      1:rnd(CATEGORIES[1].items,1), 2:rnd(CATEGORIES[2].items,2), 3:rnd(CATEGORIES[3].items,1),
      4:rnd(CATEGORIES[4].items,1), 5:rnd(CATEGORIES[5].items,1), 6:rnd(CATEGORIES[6].items,2),
      7:rnd(CATEGORIES[7].items,1), 8:rnd(CATEGORIES[8].items,1), 9:rnd(CATEGORIES[9].items,1),
      10:rnd(CATEGORIES[10].items,1), 11:rnd(CATEGORIES[11].items,1),
    });
    setExcludedItems({}); setItemWeights({});
  };

  const fetchWithRetry = async (url, opts, retries=5) => {
    let delay = 1000;
    for (let i=0; i<retries; i++) {
      try {
        const r = await fetch(url, opts);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } catch(e) {
        if (i===retries-1) throw e;
        await new Promise(res=>setTimeout(res,delay));
        delay*=2;
      }
    }
  };

  const generateAIConcept = async () => {
    if (!aiPrompt.trim()) return;
    setIsGenerating(true); setAiError('');
    const apiKey = '';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
    let catalogCtx = 'Available categories:\n';
    Object.entries(CATEGORIES).forEach(([cId,cat]) => {
      catalogCtx += `Cat ${cId} (${cat.title}):\n`;
      cat.items.forEach(item => { catalogCtx += `  ID ${item.id}: ${item.short}\n`; });
    });
    const sysInstr = `You are an elite art director AI. Map the concept to design parameters.\n${catalogCtx}\nSelect 1 item for cats 1,3,4,5,8,9,10,11. Select 2-4 for cats 2,6. Select 1 for cat 7. Respond ONLY with valid JSON mapping category IDs to arrays of item IDs.`;
    const payload = {
      contents:[{parts:[{text:`Design config for: ${aiPrompt.trim()}`}]}],
      systemInstruction:{parts:[{text:sysInstr}]},
      generationConfig:{
        responseMimeType:'application/json',
        responseSchema:{type:'OBJECT',properties:Object.fromEntries(Object.keys(CATEGORIES).map(k=>[k,{type:'ARRAY',items:{type:'INTEGER'}}]))}
      }
    };
    try {
      if (!apiKey) {
        const resp = await fetch('/api/strips/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({concept:aiPrompt.trim()})});
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        const valid={}; Object.keys(CATEGORIES).forEach(k=>valid[k]=[]);
        Object.keys(data).forEach(cId=>{ if(valid[cId]!==undefined&&Array.isArray(data[cId])) valid[cId]=data[cId].filter(id=>!isNaN(id)); });
        setSelectedItems(valid); setExcludedItems({}); setItemWeights({});
      } else {
        const result = await fetchWithRetry(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const txt = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!txt) throw new Error('Empty response');
        const parsed = JSON.parse(txt);
        const valid={}; Object.keys(CATEGORIES).forEach(k=>valid[k]=[]);
        Object.keys(parsed).forEach(cId=>{ if(valid[cId]!==undefined&&Array.isArray(parsed[cId])) valid[cId]=parsed[cId].filter(id=>!isNaN(id)); });
        setSelectedItems(valid); setExcludedItems({}); setItemWeights({});
      }
    } catch(err) {
      console.error(err); setAiError(`Ошибка: ${err.message}`);
    } finally { setIsGenerating(false); }
  };

  // ── Prompt generation
  const generatePrompt = () => {
    const formatFamily = getFormatFamily(targetFormat);
    const config = FORMAT_CONFIG[targetFormat] || FORMAT_CONFIG.strips;
    const camPreset = getCameras(targetFormat);

    const getVal = (cId) => {
      const sId = String(cId);
      const selections = selectedItems[sId];
      if (!selections || selections.length === 0) return `[[C${cId}:UNSET]]`;
      return selections.map(id => {
        const cat = CATEGORIES[sId]; if(!cat) return '';
        const item = cat.items.find(i=>i.id===id); if(!item) return '';
        const weight = itemWeights[`${sId}-${id}`];
        let rawVal = (formatFamily!=='flat' && item.t && item.t[formatFamily]) ? item.t[formatFamily] : item.val;
        rawVal = formatAdapter(rawVal, formatFamily);
        return weight>1 ? `${rawVal}::${weight}` : rawVal;
      }).filter(Boolean).join(' and ');
    };

    // Modifiers
    const psdnActive = psdnParams.subsurface>0||psdnParams.tension>0||psdnParams.clinical>0;
    const psdnParts=[];
    if(psdnParams.subsurface>0) psdnParts.push(`subsurface scattering ${psdnParams.subsurface}%`);
    if(psdnParams.tension>0) psdnParts.push(`structural material tension ${psdnParams.tension}%`);
    if(psdnParams.clinical>0) psdnParts.push(`clinical sterility ${psdnParams.clinical}%`);
    const psdnText = psdnActive ? `\n\n[P.S.D.N. OPTICS] Hyper-realistic physically-based rendering: ${psdnParts.join(', ')}. Deep caustic reflections, subsurface scattering, structural optical tension.` : '';
    const filmText = filmProfile!=='none'&&FILM_STOCKS[filmProfile]?.val ? ` Rendered on ${FILM_STOCKS[filmProfile].val}.` : '';
    const compText = composition!=='none'&&COMPOSITIONS[composition]?.val ? `\n\n[COMPOSITION] ${COMPOSITIONS[composition].val}` : '';
    const luxuryText = luxuryLevel>0 ? ` Luxury coefficient: ${luxuryLevel}%${luxuryLevel>=80?' — absolute pinnacle of material excellence':' — premium production quality'}.` : '';
    const decayText = decayLevel>0 ? ` Physical entropy & decay: ${decayLevel}%${decayLevel>=60?' — extreme patina, oxidation, rust, material collapse':' — subtle weathering and aged patina'}.` : '';
    const matrixText = matrixMode ? '\n\n[MATRIX MODE ENGAGED] Every visual element is a data artifact. All typography rendered as raw machine code, hex dumps, and terminal output.' : '';
    const behanceText = behanceMode ? '\n\n[BEHANCE SCOUT MODE] Optimized for Behance editorial presentation: clean crop, strong composition hierarchy, portfolio-ready aesthetics.' : '';
    const rawText = rawReality ? ' Absolute photographic realism only. No CGI artifacts. Physical film or digital sensor only.' : '';
    const projectText = projectTitle ? `\n\n[PROJECT] ${projectTitle}` : '';
    const extraText = customText ? `\n\n[CONTEXT] ${customText}` : '';
    const refParts=[];
    if(refs.img) refParts.push(`Img: ${refs.img}`);
    if(refs.cref) refParts.push(`CRef: ${refs.cref}`);
    if(refs.p) refParts.push(`PRef: ${refs.p}`);
    const refsText = refParts.length>0 ? `\n\n[REFERENCES] ${refParts.join(' | ')}` : '';
    const negList=['sliced image','crossed elements','overwhelming clutter'];
    if(config.negative) negList.push(...config.negative.split(', ').filter(Boolean));
    const mjEngine = `--ar ${mjParams.ar} --style raw --v 6.1 --s ${mjParams.stylize}${mjParams.chaos>0?` --c ${mjParams.chaos}`:''}${mjParams.weird>0?` --w ${mjParams.weird}`:''}${mjParams.sref?` --sref ${mjParams.sref}`:''} --no ${negList.join(', ')}`;
    const intro = config.intro(camPreset.base, customSubject);

    return `Act as a ${config.role}. You are creating ${intro}

${config.rules}

[PARADIGM & CONCEPTUAL DNA] The aesthetic follows the ${getVal(1)} school of design. Conceptual DNA fuses: ${getVal(2)}.

[COLOR PALETTE & EXACT ROTATION] Strict 3-color palette: ${getVal(3)}.${luxuryText}${decayText}
CRITICAL COLOR ROTATION: ${getVal(4)}.

[STRUCTURE & GRAPHICS] Layout: ${getVal(5)}. Dynamic composition: ${getVal(6)}. Super-graphics: ${getVal(7)}.

[TACTILITY & PRODUCTION] ${formatAdapter('Printed and materialized using '+getVal(8)+'.', formatFamily)}

[CAMERA & OPTICS] Shot with ${getVal(9)}.

[LIGHT & ATMOSPHERE] ${getVal(11)}.${filmText}${compText}

[TRIGGER FOCUS] One element disrupted by: ${getVal(10)}.${psdnText}${matrixText}${behanceText}${rawText}${projectText}${extraText}${refsText}

[TECHNICAL SPECS] Ultra-crisp. Photorealistic. Maximalist brutalist typographic logic. ${mjEngine}`.trim();
  };

  // ── Copy to clipboard (works on HTTP, no HTTPS required)
  const copyToClipboard = () => {
    const text = generatePrompt();
    const doCopy = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch(e) { console.error('Copy failed',e); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(doCopy);
    } else { doCopy(); }
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  // ── Status string
  const statusStr = useMemo(() => {
    return Object.keys(CATEGORIES).sort((a,b)=>Number(a)-Number(b)).map(cId => {
      const n = (selectedItems[cId]||[]).length;
      return n>0 ? `C${cId}[${n}]` : null;
    }).filter(Boolean).join(' · ');
  }, [selectedItems]);

  // ── Selected C3 palette preview
  const c3sel = useMemo(() => {
    const ids = selectedItems['3'] || [];
    if (ids.length === 0) return null;
    return CATEGORIES['3'].items.find(i=>i.id===ids[0]);
  }, [selectedItems]);

  if (!isReady) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#050608',color:'#c8aa6e',fontSize:'14px',letterSpacing:'0.2em',textTransform:'uppercase',fontFamily:'Inter,sans-serif'}}>
      Инициализация V47...
    </div>
  );

  const prompt = generatePrompt();

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'#050608',fontFamily:'Inter,sans-serif'}}>

      {/* ══════════════ LEFT PANEL ══════════════ */}
      <div style={{width:'380px',flexShrink:0,display:'flex',flexDirection:'column',height:'100vh',borderRight:'1px solid #1a1d25',background:'#070810',zIndex:10}}>

        {/* Header */}
        <div style={{padding:'12px 16px 10px',borderBottom:'1px solid #1a1d25',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontSize:'13px',fontWeight:900,letterSpacing:'0.2em',color:'#c8aa6e',textTransform:'uppercase'}}>STRIPS PRO GEN</div>
              <div style={{fontSize:'12px',color:'#3a3d4a',letterSpacing:'0.1em',marginTop:'2px'}}>V48 · K.S.A.R. + P.S.D.N.</div>
            </div>
            <a href="/" style={{fontSize:'11px',color:'#3a3d4a',textDecoration:'none',letterSpacing:'0.1em'}} onMouseEnter={e=>e.target.style.color='#c8aa6e'} onMouseLeave={e=>e.target.style.color='#3a3d4a'}>← DASHBOARD</a>
          </div>
        </div>

        {/* Format selector */}
        <div style={{padding:'10px 14px 8px',borderBottom:'1px solid #1a1d25',flexShrink:0}}>
          <div className="ctrl-label">Формат</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px'}}>
            {Object.entries(TARGET_FORMATS).map(([k,v]) => (
              <button key={k} className={`fmt-pill ${targetFormat===k?'active':''}`} onClick={()=>setTargetFormat(k)}>{v}</button>
            ))}
          </div>
          <input
            className="ctrl-input"
            style={{marginTop:'6px'}}
            placeholder="Уточнение объекта (необязательно)"
            value={customSubject}
            onChange={e=>setCustomSubject(e.target.value)}
          />
          <input
            className="ctrl-input"
            style={{marginTop:'4px'}}
            placeholder="Название проекта (необязательно)"
            value={projectTitle}
            onChange={e=>setProjectTitle(e.target.value)}
          />
          <textarea
            className="ctrl-input custom-scroll"
            style={{marginTop:'4px',height:'40px',fontSize:'10px'}}
            placeholder="Доп. контекст или оговорки (необязательно)"
            value={customText}
            onChange={e=>setCustomText(e.target.value)}
          />
        </div>

        {/* Scrollable controls */}
        <div className="custom-scroll" style={{flex:1,overflowY:'auto',padding:'12px 14px'}}>

          {/* Protocols */}
          <div style={{marginBottom:'14px'}}>
            <div className="section-hdr">Протоколы (пресеты)</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'5px',marginBottom:'5px'}}>
              {Object.entries(PROTOCOLS).map(([k,p])=>(
                <button key={k} className="proto-btn" onClick={()=>applyProtocol(k)} title={p.desc}>{p.name}</button>
              ))}
            </div>
            {Object.keys(customProtocols).length>0 && (
              <>
                <div style={{fontSize:'10px',color:'#3a3d4a',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px',marginTop:'6px'}}>Пользовательские</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'5px'}}>
                  {Object.entries(customProtocols).map(([k,p])=>(
                    <button key={k} className="proto-btn" onClick={()=>applyProtocol(k,true)} title={p.desc} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
                      <span onClick={(e)=>deleteCustomProtocol(k,e)} style={{marginLeft:'4px',opacity:0.5,fontSize:'10px',flexShrink:0}} title="Удалить">✕</span>
                    </button>
                  ))}
                </div>
              </>
            )}
            <button className="quantum-btn" onClick={saveCustomProtocol} style={{marginTop:'6px',fontSize:'8px'}}>➕ СОХРАНИТЬ ПРЕСЕТ</button>
          </div>

          {/* MJ Engine */}
          <div style={{marginBottom:'14px'}}>
            <div className="section-hdr">MJ Engine</div>
            <div style={{marginBottom:'7px'}}>
              <div className="ctrl-label">Соотношение сторон</div>
              <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
                {['9:16','1:1','3:2','16:9','2:3','4:5'].map(ar=>(
                  <button key={ar} className={`ar-btn ${mjParams.ar===ar?'active':''}`} onClick={()=>setMjParams(p=>({...p,ar}))}>{ar}</button>
                ))}
              </div>
            </div>
            <div style={{marginBottom:'6px'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="ctrl-label">Stylize</span><span style={{fontSize:'13px',color:'#c8aa6e',fontWeight:700}}>{mjParams.stylize}</span></div>
              <input type="range" min={0} max={1000} value={mjParams.stylize} onChange={e=>setMjParams(p=>({...p,stylize:+e.target.value}))} style={{width:'100%',height:'3px'}} />
            </div>
            <div style={{marginBottom:'6px'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="ctrl-label">Chaos</span><span style={{fontSize:'13px',color:'#c8aa6e',fontWeight:700}}>{mjParams.chaos}</span></div>
              <input type="range" min={0} max={100} value={mjParams.chaos} onChange={e=>setMjParams(p=>({...p,chaos:+e.target.value}))} style={{width:'100%',height:'3px'}} />
            </div>
            <div style={{marginBottom:'6px'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="ctrl-label">Weird</span><span style={{fontSize:'13px',color:'#c8aa6e',fontWeight:700}}>{mjParams.weird}</span></div>
              <input type="range" min={0} max={3000} value={mjParams.weird} onChange={e=>setMjParams(p=>({...p,weird:+e.target.value}))} style={{width:'100%',height:'3px'}} />
            </div>
            <div>
              <div className="ctrl-label">SREF URL</div>
              <input className="ctrl-input" placeholder="https://..." value={mjParams.sref} onChange={e=>setMjParams(p=>({...p,sref:e.target.value}))} />
            </div>
          </div>

          {/* P.S.D.N. */}
          <div style={{marginBottom:'14px',padding:'10px',background:'#0a0d14',border:'1px solid #1a1d25',borderRadius:'3px'}}>
            <div className="section-hdr">P.S.D.N. Optics</div>
            {[['subsurface','Subsurface','#4a8aff'],['tension','Tension','#ff4a4a'],['clinical','Clinical','#4affa0']].map(([k,label,color])=>(
              <div key={k} style={{marginBottom:'8px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}>
                  <span style={{fontSize:'11px',color:'#5a5e78',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.1em'}}>{label}</span>
                  <span style={{fontSize:'13px',color:color,fontWeight:700}}>{psdnParams[k]}%</span>
                </div>
                <input type="range" min={0} max={100} value={psdnParams[k]} onChange={e=>setPsdnParams(p=>({...p,[k]:+e.target.value}))} style={{width:'100%',height:'3px'}} />
                <div style={{width:`${psdnParams[k]}%`,height:'2px',background:color,borderRadius:'1px',marginTop:'2px',transition:'width 0.2s'}} />
              </div>
            ))}
          </div>

          {/* Film + Composition */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'14px'}}>
            <div>
              <div className="ctrl-label">Film / Render</div>
              <select className="ctrl-select" value={filmProfile} onChange={e=>setFilmProfile(e.target.value)}>
                {Object.entries(FILM_STOCKS).map(([k,f])=><option key={k} value={k}>{f.label}</option>)}
              </select>
            </div>
            <div>
              <div className="ctrl-label">Композиция</div>
              <select className="ctrl-select" value={composition} onChange={e=>setComposition(e.target.value)}>
                {Object.entries(COMPOSITIONS).map(([k,c])=><option key={k} value={k}>{c.label}</option>)}
              </select>
            </div>
          </div>

          {/* Toggles + sliders */}
          <div style={{marginBottom:'14px',padding:'10px',background:'#0a0d14',border:'1px solid #1a1d25',borderRadius:'3px'}}>
            <div className="section-hdr">Модификаторы</div>
            <div className="toggle-btn" onClick={handleMatrixToggle} style={{marginBottom:'8px'}}>
              <span className="toggle-label">⬛ Matrix Mode</span>
              <div className={`toggle-track ${matrixMode?'on':''}`}><div className="toggle-thumb" /></div>
            </div>
            <div className="toggle-btn" onClick={handleBehanceToggle} style={{marginBottom:'8px'}}>
              <span className="toggle-label">📊 Behance Mode</span>
              <div className={`toggle-track ${behanceMode?'on':''}`}><div className="toggle-thumb" /></div>
            </div>
            <div className="toggle-btn" onClick={()=>setRawReality(v=>!v)} style={{marginBottom:'10px'}}>
              <span className="toggle-label">📷 Raw Reality</span>
              <div className={`toggle-track ${rawReality?'on':''}`}><div className="toggle-thumb" /></div>
            </div>
            <div style={{marginBottom:'7px'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="ctrl-label">Luxury</span><span style={{fontSize:'13px',color:'#c8aa6e',fontWeight:700}}>{luxuryLevel}%</span></div>
              <input type="range" min={0} max={100} value={luxuryLevel} onChange={e=>setLuxuryLevel(+e.target.value)} style={{width:'100%',height:'3px'}} />
            </div>
            <div>
              <div style={{display:'flex',justifyContent:'space-between'}}><span className="ctrl-label">Decay / Entropy</span><span style={{fontSize:'13px',color:'#c8aa6e',fontWeight:700}}>{decayLevel}%</span></div>
              <input type="range" min={0} max={100} value={decayLevel} onChange={e=>setDecayLevel(+e.target.value)} style={{width:'100%',height:'3px'}} />
            </div>
          </div>

          {/* References */}
          <div style={{marginBottom:'14px'}}>
            <div className="section-hdr">Референсы</div>
            {[['img','Image URL (--iw)'],['cref','CRef URL (character/style)'],['p','Prompt Ref (--p)']].map(([k,ph])=>(
              <input key={k} className="ctrl-input" style={{marginBottom:'5px'}} placeholder={ph} value={refs[k]} onChange={e=>setRefs(p=>({...p,[k]:e.target.value}))} />
            ))}
          </div>

          {/* Quantum mutation */}
          <div style={{marginBottom:'12px'}}>
            <button className="quantum-btn" onClick={handleQuantumMutation}>⚡ QUANTUM MUTATION</button>
          </div>

          {/* AI input */}
          <div style={{marginBottom:'12px'}}>
            <div className="section-hdr">ИИ-Сборка</div>
            <div style={{display:'flex',gap:'6px'}}>
              <input className="ctrl-input" placeholder="Концепт: нано-медицина, глубина..." value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&!isGenerating&&generateAIConcept()} style={{flex:1}} />
              <button className="ai-btn" onClick={generateAIConcept} disabled={isGenerating||!aiPrompt.trim()}>
                {isGenerating?'..':'СБОРКА'}
              </button>
            </div>
            {aiError && <div style={{fontSize:'11px',color:'#cc4444',marginTop:'4px',letterSpacing:'0.05em'}}>{aiError}</div>}
          </div>

          {/* Code parser */}
          <div style={{marginBottom:'12px'}}>
            <div className="section-hdr">Код-строка</div>
            <textarea className="ctrl-input custom-scroll" value={parserInput} onChange={handleParse}
              style={{height:'52px',lineHeight:'1.5'}} placeholder="1(3, 15) - 2(7, 22) - 3(4) - ..."/>
          </div>

          {/* Status */}
          {statusStr && (
            <div style={{fontSize:'11px',color:'#3a3d4a',letterSpacing:'0.08em',marginBottom:'10px',lineHeight:'1.6',wordBreak:'break-all'}}>
              {statusStr}
            </div>
          )}

          {/* C3 color preview */}
          {c3sel && c3sel.hex && (
            <div style={{marginBottom:'10px',display:'flex',gap:'5px',alignItems:'center'}}>
              {c3sel.hex.map((h,i)=>(
                <div key={i} style={{width:'18px',height:'18px',borderRadius:'2px',background:h,border:'1px solid #2a2d36',flexShrink:0}} title={h} />
              ))}
              <span style={{fontSize:'11px',color:'#4a5068',marginLeft:'4px'}}>{c3sel.short}</span>
            </div>
          )}

          {/* Prompt textarea */}
          <div style={{marginBottom:'6px'}}>
            <div className="section-hdr">Промпт</div>
            <textarea readOnly value={prompt} className="ctrl-input custom-scroll"
              style={{height:'170px',lineHeight:'1.5',fontSize:'11px',color:'#8a8ea8',cursor:'text'}} />
          </div>

        </div>

        {/* Copy button */}
        <div style={{padding:'10px 14px',borderTop:'1px solid #1a1d25',flexShrink:0}}>
          <button className={`copy-btn ${copied?'copied':''}`} onClick={copyToClipboard}>
            {copied?'✓ PROMPT COPIED':'COPY PROMPT TO CLIPBOARD'}
          </button>
        </div>
      </div>

      {/* ══════════════ RIGHT PANEL — CATEGORIES ══════════════ */}
      <div className="custom-scroll" style={{flex:1,overflowY:'auto',background:'#050608'}}>
        {Object.entries(CATEGORIES).sort(([a],[b])=>Number(a)-Number(b)).map(([cId, cat]) => {
          const sels = selectedItems[cId] || [];
          const excls = excludedItems[cId] || [];
          return (
            <div key={cId} style={{borderBottom:'1px solid #0d0f14',padding:'12px 16px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                <span style={{fontSize:'12px',fontWeight:900,letterSpacing:'0.15em',color:'#c8aa6e',textTransform:'uppercase'}}>{cat.title}</span>
                <span style={{fontSize:'10px',color:'#3a3d4a',letterSpacing:'0.05em'}}>
                  {sels.length>0&&<span style={{color:'#c8aa6e80'}}>{sels.length} sel</span>}
                  {excls.length>0&&<span style={{color:'#8b1a1a',marginLeft:'6px'}}>{excls.length} excl</span>}
                  <span style={{marginLeft:'6px',color:'#2a2d36'}}>{cat.items.length} total</span>
                </span>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:'3px'}}>
                {cat.items.map(item => {
                  const isSel = sels.includes(item.id);
                  const isExcl = excls.includes(item.id);
                  const w = itemWeights[`${cId}-${item.id}`];
                  return (
                    <span
                      key={item.id}
                      className={`chip${isSel?(w>1?' w2':' selected'):''} ${isExcl?'excluded':''}`}
                      onClick={()=>handleToggle(cId,item.id)}
                      onDoubleClick={()=>handleDoubleClick(cId,item.id)}
                      title={item.val}
                    >
                      <span style={{opacity:0.5,marginRight:'2px'}}>{item.id}</span>
                      {item.short}
                      {isSel&&w>1&&<span style={{fontSize:'9px',marginLeft:'1px',opacity:0.8}}>×2</span>}
                      {item.hex&&isSel&&(
                        <span style={{display:'inline-flex',gap:'2px',marginLeft:'3px'}}>
                          {item.hex.map((h,i)=><span key={i} className="clr-dot" style={{background:h}} />)}
                        </span>
                      )}
                      <span className="excl-btn" onClick={e=>{e.stopPropagation();handleExclude(cId,item.id);}}>
                        {isExcl?'↺':'✕'}
                      </span>
                    </span>
                  );
                })}
              </div>
            </div>
          );
        })}
        <div style={{height:'40px'}} />
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
