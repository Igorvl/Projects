        adapted = adapted.replace(/\b(parchment paper|cotton stock|cardboard|paper|parchment)\b/gi, 'machined aerospace titanium');

        adapted = adapted.replace(/\b(layout)\b/gi, 'hardware topology');
    } else if (formatFamily === 'packaging') {
        adapted = adapted.replace(/\b(parchment paper|cotton stock|cardboard|paper|parchment)\b/gi, 'heavy rigid board and premium textured stock');

    let delay = 1000;
    for (let i = 0; i < retries; i++) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        return await response.json();
      } catch (error) {
        if (i === retries - 1) throw error;
        await new Promise(res => setTimeout(res, delay));
        delay *= 2;
      }
    }
  };
